name: 京东签到薅羊毛

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00，与上游 Part3 一致。
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jd-sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: 验证京东响应处理（离线）
        run: python -m unittest discover -s tests -p 'test_jd_sign.py' -v
      - name: 京东京豆签到
        env:
          JD_COOKIE: ${{ secrets.JD_COOKIE }}
        run: python scripts/jd_sign.py
